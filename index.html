<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List - Organizador de Tarefas</title>
    <meta name="description" content="Lista de tarefas simples feita com jQuery.">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container">
        <h1>Minhas tarefas</h1>

        <!-- Formulário para adicionar tarefas (Enter ou botão) -->
        <form id="form-tarefa" class="form-tarefa" autocomplete="off">
            <label for="nova-tarefa" class="sr-only">Nova tarefa</label>
            <input type="text" id="nova-tarefa" class="txtb" placeholder="Descreva a tarefa..." maxlength="200">
            <button type="submit" class="btn-adicionar">
                <i class="fas fa-plus" aria-hidden="true"></i>
                <span>Adicionar</span>
            </button>
        </form>
        <p id="aviso" class="aviso" role="status" aria-live="polite"></p>

        <section class="lista" aria-labelledby="titulo-pendentes">
            <h2 id="titulo-pendentes">Pendentes <span class="contador" id="contador-pendentes">0</span></h2>
            <ul id="lista-pendentes" class="tarefas"></ul>
            <p class="vazio" id="vazio-pendentes">Nenhuma tarefa pendente. 🎉</p>
        </section>

        <section class="lista concluidas" aria-labelledby="titulo-concluidas">
            <h2 id="titulo-concluidas">Concluídas <span class="contador" id="contador-concluidas">0</span></h2>
            <ul id="lista-concluidas" class="tarefas"></ul>
            <p class="vazio" id="vazio-concluidas">Nenhuma tarefa concluída ainda.</p>
        </section>
    </main>

    <script src="./jquery-3.5.1.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
